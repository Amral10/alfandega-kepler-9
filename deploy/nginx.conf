# Exemplo de servidor estático. Copie site/ para /usr/share/nginx/html.
# Adapte domínio e TLS na infraestrutura escolhida antes de uma publicação real.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        application/json json;
        image/svg+xml svg;
        image/jpeg jpg jpeg;
        text/plain txt;
    }
    location / { try_files $uri $uri/ =404; }
}
